version: '3.8'

# ==============================================================
# ENTORNO DE PRUEBAS AUTOMATIZADAS CON POSTGRESQL REAL
# Uso: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
# ==============================================================

services:
  postgres_test:
    image: postgres:16-alpine
    container_name: torneo_talento_pg_test
    environment:
      POSTGRES_DB: torneo_talento_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d torneo_talento_test"]
      interval: 3s
      timeout: 3s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  backend_test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: torneo_talento_backend_test
    depends_on:
      postgres_test:
        condition: service_healthy
    environment:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://test_user:test_password@postgres_test:5432/torneo_talento_test
      ADMIN_SECRET: TestAdminKey2026
      LATENCY_GRACE_PERIOD_MS: 800
      PUBLIC_URL: http://localhost:3001
    command: ["sh", "-c", "node src/db/init.js && npm test"]

