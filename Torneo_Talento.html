<style>
/* Concepto: el mismo mundo de la exposición (lámina de ingeniería esmeralda con cuadrícula de plano y oro),
   convertido en un tablero de torneo para proyectar. Un solo look oscuro a propósito. */
:root {
  --bg: #0a302b; --bg-2: #0b2a38; --ink: #04130f;
  --mist: #eef4f1; --sage: #a9c7bb; --gold: #f2a93b; --gold-2: #ffcf7a;

  --panel: rgba(3, 12, 12, 0.55);
  --ok: #2fa37f; --bad: #e0714f;
  --c0: #d9573c; --c1: #2f6fd6; --c2: #d99a1e; --c3: #1f9a72;
  --f-head: "Archivo", "Arial Narrow", Arial, system-ui, sans-serif;
  --f-body: "Archivo", "Segoe UI", Calibri, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background-color: var(--bg); color: var(--mist); font-family: var(--f-body); -webkit-font-smoothing: antialiased; transition: background-color .8s;
  background-image:
    radial-gradient(70% 60% at 65% 35%, rgba(255,255,255,.08), rgba(255,255,255,0) 70%),
    radial-gradient(130% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.5) 100%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 120px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 120px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 24px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 24px);
  background-attachment: fixed; }
body[data-phase="duel"] { background-color: #11234d; }
body[data-phase="podium"] { background-color: #241a44; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; width: 100%; height: 100%; }
.shell { min-height: 100vh; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 28px; }
.frame { position: relative; flex: 1; display: flex; flex-direction: column; border: 1px solid var(--line); padding: clamp(14px, 2.4vw, 34px); }
.frame::before, .frame::after { content: ""; position: absolute; width: 18px; height: 18px; border: 2px solid var(--gold); }
.frame::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; } .frame::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

.primary:hover:not(:disabled) { background: var(--gold-2); }

/* Inscripción */

.cnt:empty { display: none; }
.cnt.warn { color: var(--bad); }

.prizes { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; margin: 0; }

.m0 { background: #f2c14e; } .m1 { background: #c9d3d6; } .m2 { background: #d38a52; }

/* Cuadro */
.bhead { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.bact { display: flex; gap: 10px; flex-wrap: wrap; }
.scroll { overflow-x: auto; padding-bottom: 8px; }
.bracket { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(210px, 1fr); gap: 22px; min-width: min-content; }
.col { display: flex; flex-direction: column; }
.rname { font: 700 15px/1.2 var(--f-head); padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--line-2); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.rname small { font: 500 11px/1 var(--f-mono); color: var(--gold); letter-spacing: .08em; }
.col.third .rname small { color: var(--sage); }
.ms { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 12px; }
.match { position: relative; text-align: left; width: 100%; padding: 0; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.28); overflow: hidden; display: grid; }
.match .pl { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; font: 600 14.5px/1.2 var(--f-body); }

.match .pl .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.match.wait .nm { color: rgba(169,199,187,.6); }
.match.done .pl:not(.w) .nm { color: rgba(169,199,187,.6); text-decoration: line-through; text-decoration-color: rgba(169,199,187,.4); }
.match.done .pl.w { background: rgba(242,169,59,.1); } .match.done .pl.w .sc { color: var(--gold); }

.match.ready:hover { background: rgba(242,169,59,.08); }

.match:disabled { cursor: default; }
.hint { color: var(--sage); font-size: 14px; margin-top: 18px; }

/* Duelo */
.duel { display: grid; gap: clamp(16px, 2.4vw, 28px); }
.duelhead { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 14px; align-items: center; }
.fighter { display: grid; gap: 4px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.25); transition: border-color .3s, background .3s; min-width: 0; }

.fighter .dots { display: flex; gap: 5px; } .fighter.r .dots { justify-content: flex-end; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line-2); }
.dots i.ok { background: var(--ok); border-color: var(--ok); } .dots i.bad { background: var(--bad); border-color: var(--bad); } .dots i.now { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(242,169,59,.35); }
.vs { display: grid; justify-items: center; gap: 4px; text-align: center; font: 500 11px/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--sage); }
.vs b { font: 800 clamp(24px, 2.6vw, 36px)/1 var(--f-head); color: var(--mist); letter-spacing: 0; }
.turn { display: grid; justify-items: center; text-align: center; gap: 16px; padding-block: clamp(20px, 6vh, 70px); }
.turn .big { font: 800 clamp(44px, 8vw, 110px)/.95 var(--f-head); letter-spacing: -0.03em; text-wrap: balance; }
.turn .big.gold { color: var(--gold); }
.qcard { display: grid; gap: clamp(14px, 2vw, 22px); }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font: 500 12px/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--sage); }
.qmeta .chip-t { background: var(--gold); color: #1a1206; padding: 5px 9px; border-radius: 6px; font-weight: 600; }
.qmeta .who { margin-left: auto; text-transform: none; letter-spacing: 0; font: 500 15px/1.3 var(--f-body); } .qmeta .who b { color: var(--mist); }
.timer { display: flex; align-items: center; gap: 14px; }
.timer .tb { flex: 1; height: 8px; border-radius: 8px; background: rgba(255,255,255,.1); overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--gold); transform-origin: left; transition: transform .1s linear, background .3s; }
.timer i.low { background: var(--bad); }
#tnum { font: 700 26px/1 var(--f-mono); min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.q { font: 700 clamp(24px, 3vw, 44px)/1.15 var(--f-head); margin: 0; max-width: 32em; }
.opts { display: grid; gap: 12px; }
.opts.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { display: flex; align-items: center; gap: 14px; text-align: left; border: 0; border-radius: 12px; padding: clamp(14px, 2vw, 24px) 18px; min-height: clamp(70px, 10vh, 110px); color: #fff; font: 700 clamp(16px, 1.6vw, 24px)/1.2 var(--f-body); box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); transition: transform .12s, opacity .3s, filter .2s; }
.opt:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-2px); }
.opt .sh { flex: none; width: 40px; height: 40px; display: grid; place-items: center; background: rgba(0,0,0,.2); border-radius: 8px; font-size: 20px; }
.c0 { background: var(--c0); } .c1 { background: var(--c1); } .c2 { background: var(--c2); } .c3 { background: var(--c3); }
.opt.dim { opacity: .28; } .opt.wrong { opacity: .55; outline: 3px solid #fff; outline-offset: -3px; } .opt.right { outline: 4px solid #fff; outline-offset: 3px; }
.opt:disabled { cursor: default; }
.ord { display: grid; gap: 16px; }
.slots { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.slot { display: flex; align-items: center; gap: 10px; min-height: 54px; border: 1px dashed var(--line-2); border-radius: 10px; padding: 8px 12px; font: 600 16px/1.2 var(--f-body); }
.slot.full { border-style: solid; border-color: var(--gold); background: rgba(242,169,59,.1); }
.slot .n { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #1a1206; font: 600 12px/1 var(--f-mono); }
.pool { display: flex; flex-wrap: wrap; gap: 10px; }

.ordrev, .numrev { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

.ordrev ol.bad, .numrev b.bad { color: var(--bad); }

.numrow input { font: 700 clamp(26px, 3vw, 40px)/1 var(--f-mono); padding: 12px 16px; text-align: right; }

.s1 .block { background: linear-gradient(#ffd66b, #e9a23b); } .s2 .block { background: linear-gradient(#e6ecee, #a9b6ba); } .s3 .block { background: linear-gradient(#e7a675, #b7693a); }
.pact { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; justify-content: center; }

.bankgrid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.filters { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; } .filters select { width: auto; } .filters input { flex: 1; min-width: 160px; }
.tbl { overflow: auto; max-height: 68vh; border: 1px solid var(--line); border-radius: 12px; }

th { position: sticky; top: 0; background: #082520; text-align: left; font: 500 11px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--sage); padding: 10px 12px; }
td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; line-height: 1.4; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script>
(() => {
"use strict";
const KEY = "torneo-talento-v1";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const fmt = (n) => Number(n).toLocaleString("es-CO", { maximumFractionDigits: 2 });
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Banco ---------- */
const hid = (t) => { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) >>> 0; return "q" + h.toString(36); };
const STATIC = BANCO.map((r) => ({ id: hid(r[3]), t: r[0], l: r[1], c: r[2], q: r[3], o: r[0] === "vf" ? null : r[4], a: r[0] === "vf" ? r[4] : null, e: r[5] }));
const TYPE = { mc: "Opción múltiple", vf: "Verdadero o falso", ord: "Ordena", num: "Calcula" };

const GENS = {
  rotacion: { l: 2, make() { const s = rnd(3, 24), p = rnd(4, 30) * 10; return { key: `rot${s}-${p}`, q: `En un año salieron ${s} personas y la plantilla promedio fue de ${p}. ¿Cuál es la rotación? (en %, con 1 decimal)`, ans: Math.round(s / p * 1000) / 10, tol: 0.1, unit: "%", e: `${s} ÷ ${p} × 100 = ${fmt(Math.round(s / p * 1000) / 10)} %` }; } },
  carga: { l: 2, make() { const u = rnd(5, 60) * 1000, h = rnd(2, 16) * 0.05; const v = Math.round(u * h); return { key: `car${u}-${h.toFixed(2)}`, q: `Una planta debe producir ${fmt(u)} unidades al mes y cada una requiere ${fmt(h)} h de trabajo. ¿Cuántas horas-hombre necesita al mes?`, ans: v, tol: 0.5, unit: "h", e: `${fmt(u)} × ${fmt(h)} = ${fmt(v)} horas-hombre` }; } },
  brecha: { l: 1, make() { const n = rnd(30, 140), m = n - rnd(3, 25); return { key: `bre${n}-${m}`, q: `Una planta necesita ${n} operarios y hoy tiene ${m}. ¿Cuántos operarios le faltan?`, ans: n - m, tol: 0, unit: "operarios", e: `${n} − ${m} = ${n - m}` }; } },
  productivas: { l: 3, make() { const H = rnd(40, 50) * 4, a = rnd(3, 12), f = rnd(16, 19) * 5; const v = Math.round(H * (1 - a / 100) * (f / 100) * 10) / 10; return { key: `pro${H}-${a}-${f}`, q: `Un operario trabaja ${H} h al mes, con ${a} % de ausentismo y ${f} % de eficiencia. ¿Cuántas horas productivas tiene? (1 decimal)`, ans: v, tol: 0.6, unit: "h", e: `${H} × ${fmt(1 - a / 100)} × ${fmt(f / 100)} ≈ ${fmt(v)} h` }; } },
  operarios: { l: 3, make() { const C = rnd(30, 120) * 200, r = rnd(130, 165); const v = Math.ceil(C / r); return { key: `ope${C}-${r}`, q: `La carga es de ${fmt(C)} horas-hombre al mes y cada operario rinde ${r} h productivas. ¿Cuántos operarios se necesitan? (redondea hacia arriba)`, ans: v, tol: 0, unit: "operarios", e: `${fmt(C)} ÷ ${r} = ${fmt(Math.round(C / r * 100) / 100)} → ${v}` }; } },
};

/* ---------- Estado ---------- */
const DEF = () => ({ v: 1, phase: "setup", settings: { perPlayer: 2, time: 20, prizes: ["", "", ""], sound: true }, draft: "", players: [], rounds: [], third: null, used: {}, gen: {}, custom: [], cur: null, view: "bracket" });
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || DEF(); } catch (e) { S = DEF(); }
S = Object.assign(DEF(), S);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const allQ = () => STATIC.concat(S.custom);
const remaining = () => allQ().filter(q => !S.used[q.id]);

/* ---------- Sonido ---------- */
let actx = null;
function beep(kind) {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const seq = kind === "ok" ? [[660, .09], [880, .14]] : kind === "bad" ? [[220, .18], [160, .22]] : kind === "win" ? [[523, .12], [659, .12], [784, .12], [1047, .3]] : [[880, .05]];
    let t = actx.currentTime;
    seq.forEach(([f, d]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "triangle"; o.frequency.value = f; g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d); t += d * .9; });
  } catch (e) {}
}

/* ---------- Cuadro ---------- */
const BYE = -1;
function buildBracket(names) {
  const order = shuffle(names.map((_, i) => i));
  const n = order.length; let size = 1; while (size < n) size *= 2;
  const R = Math.log2(size), byes = size - n, rounds = [];
  let k = 0; const r0 = [];
  for (let i = 0; i < size / 2; i++) { const a = order[k++]; const b = i < byes ? BYE : order[k++]; r0.push(mkMatch(0, i, a, b)); }
  rounds.push(r0);
  for (let r = 1; r < R; r++) { const arr = []; for (let i = 0; i < size / Math.pow(2, r + 1); i++) arr.push(mkMatch(r, i, null, null)); rounds.push(arr); }
  S.rounds = rounds; S.third = R >= 2 ? mkMatch("t", 0, null, null) : null;
  autoResolve();
}
function mkMatch(r, i, a, b) { return { id: r + "-" + i, r, i, a, b, sa: 0, sb: 0, w: null, lz: null, done: false }; }
const R = () => S.rounds.length;
function matchById(id) { if (S.third && S.third.id === id) return S.third; for (const rd of S.rounds) for (const m of rd) if (m.id === id) return m; return null; }
function setResult(m, winSide) {
  m.done = true; m.w = winSide === "a" ? m.a : m.b; m.lz = winSide === "a" ? m.b : m.a;
  if (m.r === "t") return;
  if (m.r < R() - 1) { const nx = S.rounds[m.r + 1][Math.floor(m.i / 2)]; if (m.i % 2 === 0) nx.a = m.w; else nx.b = m.w; }
  if (S.third && m.r === R() - 2) { if (m.i % 2 === 0) S.third.a = m.lz; else S.third.b = m.lz; }
}
function autoResolve() {
  let changed = true;
  while (changed) { changed = false;
    const all = S.rounds.flat().concat(S.third ? [S.third] : []);
    for (const m of all) { if (m.done || m.a === null || m.b === null) continue;
      if (m.a === BYE && m.b === BYE) { setResult(m, "a"); changed = true; }
      else if (m.b === BYE) { setResult(m, "a"); m.bye = true; changed = true; }
      else if (m.a === BYE) { setResult(m, "b"); m.bye = true; changed = true; } }
  }
}
const ready = (m) => m && !m.done && m.a !== null && m.b !== null && m.a !== BYE && m.b !== BYE;
function nextMatch() { for (const rd of S.rounds) for (const m of rd) if (ready(m)) { if (m.r === R() - 1 && ready(S.third)) return S.third; return m; } return ready(S.third) ? S.third : null; }
const finished = () => { const f = S.rounds[R() - 1][0]; return f.done && (!S.third || S.third.done || S.third.a === null && S.third.b === null); };
const pname = (i) => i === null ? "Por definir" : i === BYE ? "Pasa directo" : S.players[i];
function roundName(r) {
  if (r === "t") return "Tercer puesto";
  const left = R() - r;
  return left === 1 ? "Final" : left === 2 ? "Semifinal" : left === 3 ? "Cuartos de final" : left === 4 ? "Octavos de final" : "Ronda " + (r + 1);
}
function levelFor(m) { const rr = R(); if (m.r === "t") return rr >= 3 ? 3 : 2; if (rr === 1) return 2; if (m.r === rr - 1) return 3; return Math.min(3, 1 + Math.floor(m.r * 3 / rr)); }

/* ---------- Elegir pregunta sin repetir ---------- */
function genQ(level) {
  const names = Object.keys(GENS).filter(k => Math.abs(GENS[k].l - level) <= 1);
  for (let tries = 0; tries < 200; tries++) {
    const k = names[Math.floor(Math.random() * names.length)]; const g = GENS[k].make();
    if (!S.gen[g.key]) { S.gen[g.key] = 1; return { id: "gen:" + g.key, t: "num", l: GENS[k].l, c: "Cálculo", q: g.q, ans: g.ans, tol: g.tol, unit: g.unit, e: g.e }; }
  }
  return null;
}
function pickQ(level, lastType) {
  const rem = remaining();
  for (const lv of [level, level - 1, level + 1, level - 2, level + 2]) {
    let pool = rem.filter(q => q.l === lv); if (!pool.length) continue;
    const varied = pool.filter(q => q.t !== lastType); if (varied.length) pool = varied;
    const q = pool[Math.floor(Math.random() * pool.length)]; S.used[q.id] = 1; return prep(q);
  }
  return null;
}
function prep(q) { const x = Object.assign({}, q); if (x.t === "mc") { x.shown = shuffle(x.o); x.correct = x.o[0]; } if (x.t === "ord") { let s = shuffle(x.o); if (s.join() === x.o.join()) s = s.reverse(); x.shown = s; } return x; }
const limitFor = (q) => S.settings.time + (q.t === "ord" ? 15 : q.t === "num" ? 40 : 0);

/* ---------- Duelo ---------- */
function startDuel(m) {
  const turns = []; for (let k = 0; k < S.settings.perPlayer; k++) { turns.push({ p: "a" }, { p: "b" }); }
  if (Math.random() < .5) turns.forEach(t => t.p = t.p === "a" ? "b" : "a");
  S.cur = { mid: m.id, level: levelFor(m), turns, idx: 0, stage: "intro", sudden: 0, lastType: null };
  S.phase = "duel"; save(); render();
}
function curTurn() { return S.cur.turns[S.cur.idx]; }
function showQuestion() {
  const t = curTurn();
  if (!t.q) { t.q = pickQ(S.cur.level, S.cur.lastType); if (!t.q) { toast("No quedan preguntas sin usar. Agrega más en la pestaña Banco o vuelve a habilitar las usadas."); return; } S.cur.lastType = t.q.t; }
  S.cur.stage = "question"; S.cur.t0 = Date.now(); t.pick = []; save(); render();
}
let timerH = null;
function startTimer() {
  clearInterval(timerH); const t = curTurn(), lim = limitFor(t.q) * 1000;
  const tick = () => {
    const left = Math.max(0, lim - (Date.now() - S.cur.t0)); const bar = $("#tbar"), num = $("#tnum");
    if (bar) bar.style.transform = `scaleX(${left / lim})`; if (num) num.textContent = Math.ceil(left / 1000);
    if (bar) bar.classList.toggle("low", left < 5000);
    if (left <= 0) { clearInterval(timerH); answer(null); }
  };
  tick(); timerH = setInterval(tick, 100);
}
function check(q, given) {
  if (given === null || given === undefined) return false;
  if (q.t === "mc") return given === q.correct;
  if (q.t === "vf") return given === q.a;
  if (q.t === "ord") return given.join("|") === q.o.join("|");
  if (q.t === "num") { let x = String(given).trim().replace(/\s/g, ""); if (x.includes(",")) x = x.replace(/\./g, "").replace(",", "."); else if (/^\d{1,3}(\.\d{3})+$/.test(x)) x = x.replace(/\./g, ""); const v = parseFloat(x); return !isNaN(v) && Math.abs(v - q.ans) <= q.tol + 1e-9; }
  return false;
}
function answer(given) {
  if (!S.cur || S.cur.stage !== "question") return;
  clearInterval(timerH);
  const t = curTurn(), lim = limitFor(t.q) * 1000, el = Math.min(lim, Date.now() - S.cur.t0);
  const ok = check(t.q, given); const pts = ok ? Math.round(1000 * (1 - (el / lim) / 2)) : 0;
  t.res = { ok, pts, given, time: Math.round(el / 100) / 10 };
  const m = matchById(S.cur.mid); if (t.p === "a") m.sa += pts; else m.sb += pts;
  S.cur.stage = "reveal"; beep(ok ? "ok" : "bad"); save(); render();
}
function nextTurn() {
  const c = S.cur, m = matchById(c.mid);
  if (c.idx < c.turns.length - 1) { c.idx++; c.stage = "intro"; save(); render(); return; }
  if (m.sa === m.sb) { c.sudden++; const first = Math.random() < .5 ? "a" : "b"; c.turns.push({ p: first, sudden: true }, { p: first === "a" ? "b" : "a", sudden: true }); c.level = Math.min(3, c.level + 1); c.idx++; c.stage = "intro"; save(); render(); return; }
  c.stage = "result"; beep("win"); save(); render();
}
function closeDuel() {
  const m = matchById(S.cur.mid); setResult(m, m.sa > m.sb ? "a" : "b"); autoResolve();
  S.cur = null; S.phase = finished() ? "podium" : "bracket"; save(); render();
}
function swapQuestion() { const t = curTurn(); clearInterval(timerH); t.q = null; showQuestion(); }

/* ---------- Vistas ---------- */
const app = () => $("#app");
function render() {
  document.body.dataset.phase = S.phase;
  $("#nav").innerHTML = navHTML();
  if (S.view === "banco" && S.phase !== "duel") return renderBank();
  if (S.phase === "setup") return renderSetup();
  if (S.phase === "bracket") return renderBracket();
  if (S.phase === "duel") return renderDuel();
  if (S.phase === "podium") return renderPodium();
}
function navHTML() {
  const rem = remaining().length;
  const tab = (v, label) => `<button class="tab ${S.view === v ? "on" : ""}" data-view="${v}" ${S.phase === "duel" ? "disabled" : ""}>${label}</button>`;
  return `<div class="brand"><span class="mk"></span><span>Torneo del talento</span></div>
    <div class="tabs">${tab("bracket", S.phase === "setup" ? "Inscripción" : "Torneo")}${tab("banco", "Banco")}</div>
    <div class="meta"><span title="Preguntas fijas sin usar">${rem} preguntas sin usar</span><button class="ghost sm" id="snd" aria-pressed="${S.settings.sound}">${S.settings.sound ? "Sonido on" : "Sonido off"}</button></div>`;
}
document.addEventListener("click", (e) => {
  const v = e.target.closest("[data-view]"); if (v && !v.disabled) { S.view = v.dataset.view; save(); render(); return; }
  if (e.target.closest("#snd")) { S.settings.sound = !S.settings.sound; save(); render(); }
});

function renderSetup() {
  const s = S.settings;
  app().innerHTML = `<section class="setup">
    <div class="intro"><div class="eyebrow">Planeación estratégica del talento humano</div>
      <h1>Torneo <em>del talento</em></h1>
      <p class="lead">Duelos uno contra uno con preguntas de la exposición. Gana quien sume más puntos: acertar rápido da hasta 1000. La dificultad sube en cada ronda y ninguna pregunta se repite.</p>
      <ul class="rules"><li><b>3 tipos de pregunta:</b> opción múltiple, verdadero o falso y ordenar.</li><li><b>Empate:</b> muerte súbita con una pregunta más para cada uno.</li><li><b>Premios:</b> final para 1.º y 2.º, y duelo por el 3.º entre los semifinalistas.</li></ul></div>
    <form class="card" id="fs">
      <label for="names">Participantes <small>uno por línea · mínimo 2</small></label>

        <label for="tt">Segundos por pregunta<select id="tt">${[10, 15, 20, 30, 45].map(n => `<option ${n === s.time ? "selected" : ""}>${n}</option>`).join("")}</select></label>
      </div>
      <fieldset class="prizes"><legend>Premios <small>opcional</small></legend>
        ${[0, 1, 2].map(i => `<label for="pz${i}"><span class="medal m${i}">${i + 1}.º</span><input id="pz${i}" value="${esc(s.prizes[i])}" placeholder="${["Premio del primer puesto", "Premio del segundo puesto", "Premio del tercer puesto"][i]}"></label>`).join("")}
      </fieldset>

  const ta = $("#names");
  const count = () => { const n = ta.value.split("\n").map(x => x.trim()).filter(Boolean); const u = new Set(n.map(x => x.toLowerCase())); const need = n.length < 2 ? 0 : (n.length - 1 + (n.length >= 4 ? 1 : 0)) * 2 * (+$("#pp").value); const left = remaining().length;
    $("#cnt").textContent = n.length ? `${n.length} participantes · usarán unas ${need} preguntas · hay ${left} disponibles${u.size < n.length ? " · hay nombres repetidos" : ""}` : `Hay ${left} preguntas disponibles`;
    $("#cnt").classList.toggle("warn", need > left); return n; };
  ta.addEventListener("input", () => { S.draft = ta.value; save(); count(); }); $("#pp").addEventListener("change", count); count();
  $("#fs").addEventListener("submit", (e) => {
    e.preventDefault(); const n = count(); const u = new Set(n.map(x => x.toLowerCase()));
    if (n.length < 2) { $("#err").textContent = "Escribe al menos dos participantes."; return; }
    if (n.length > 64) { $("#err").textContent = "El máximo es 64 participantes."; return; }
    if (u.size < n.length) { $("#err").textContent = "Hay nombres repetidos: agrega un apellido o inicial para diferenciarlos."; return; }
    const need = (n.length - 1 + (n.length >= 4 ? 1 : 0)) * 2 * (+$("#pp").value);
    if (need > remaining().length) { $("#err").textContent = `Este torneo necesita unas ${need} preguntas y solo quedan ${remaining().length} sin usar. Baja las preguntas por jugador, agrega preguntas en la pestaña Banco o vuelve a habilitar las usadas.`; return; }
    S.settings.perPlayer = +$("#pp").value; S.settings.time = +$("#tt").value; S.settings.prizes = [0, 1, 2].map(i => $("#pz" + i).value.trim());
    S.players = n; buildBracket(n); S.phase = finished() ? "podium" : "bracket"; S.view = "bracket"; save(); render();

function matchCard(m) {
  const cls = m.done ? "done" : ready(m) ? "ready" : "wait";
  const side = (p, sc, isW) => `<div class="pl ${isW ? "w" : ""} ${p === BYE ? "bye" : ""}"><span class="nm">${esc(pname(p))}</span>${m.done && !m.bye ? `<span class="sc">${sc}</span>` : ""}</div>`;
  return `<button class="match ${cls}" data-m="${m.id}" ${ready(m) ? "" : "disabled"} aria-label="${esc(pname(m.a))} contra ${esc(pname(m.b))}">${side(m.a, m.sa, m.done && m.w === m.a)}${side(m.b, m.sb, m.done && m.w === m.b)}${ready(m) ? `<span class="go">Jugar</span>` : ""}</button>`;
}
function renderBracket() {
  const nm = nextMatch();
  app().innerHTML = `<section class="bracket-wrap">
    <div class="bhead"><div><div class="eyebrow">${S.players.length} participantes · ${S.settings.perPlayer} pregunta${S.settings.perPlayer > 1 ? "s" : ""} por jugador</div><h2>Cuadro del torneo</h2></div>
      <div class="bact">${nm ? `<button class="primary" id="nextm">Siguiente duelo: ${esc(pname(nm.a))} vs ${esc(pname(nm.b))}</button>` : ""}<button class="ghost" id="reset">Nuevo torneo</button></div></div>
    <div class="scroll"><div class="bracket" style="--cols:${R()}">${S.rounds.map((rd, r) => `<div class="col"><div class="rname">${roundName(r)}<small>Nivel ${"★".repeat(levelFor(rd[0]))}${"☆".repeat(3 - levelFor(rd[0]))}</small></div><div class="ms">${rd.map(matchCard).join("")}</div></div>`).join("")}
      ${S.third ? `<div class="col third"><div class="rname">Tercer puesto<small>Perdedores de semifinal</small></div><div class="ms">${matchCard(S.third)}</div></div>` : ""}</div></div>
    <p class="hint">Toca cualquier duelo marcado con “Jugar” para escoger quién compite ahora.</p>
    <div class="confirm" id="cf" hidden><span>¿Borrar este torneo y volver a la inscripción? Los nombres se conservan.</span><button class="primary sm" id="cfy">Sí, empezar de nuevo</button><button class="ghost sm" id="cfn">Cancelar</button></div></section>`;
  app().querySelectorAll("[data-m]").forEach(b => b.onclick = () => startDuel(matchById(b.dataset.m)));
  const nb = $("#nextm"); if (nb) nb.onclick = () => startDuel(nm);
  $("#reset").onclick = () => { $("#cf").hidden = false; };
  $("#cfn").onclick = () => { $("#cf").hidden = true; };
  $("#cfy").onclick = () => { const keep = { draft: S.players.join("\n"), settings: S.settings, custom: S.custom, used: S.used, gen: S.gen }; S = Object.assign(DEF(), keep); save(); render(); };
}

function scoreHead(m) {
  const c = S.cur, t = curTurn();
  const dots = (side) => c.turns.filter(x => x.p === side).map(x => `<i class="${x.res ? (x.res.ok ? "ok" : "bad") : (x === t ? "now" : "")}"></i>`).join("");
  return `<div class="duelhead">
    <div class="fighter ${t.p === "a" ? "active" : ""}"><span class="nm">${esc(pname(m.a))}</span><span class="pts">${m.sa}</span><span class="dots">${dots("a")}</span></div>
    <div class="vs"><span>${roundName(m.r)}</span><b>VS</b><span>${c.sudden ? "Muerte súbita" : "Turno " + (c.idx + 1) + " de " + c.turns.length}</span></div>
    <div class="fighter r ${t.p === "b" ? "active" : ""}"><span class="nm">${esc(pname(m.b))}</span><span class="pts">${m.sb}</span><span class="dots">${dots("b")}</span></div></div>`;
}
const SH = ["▲", "◆", "●", "■"];
function renderDuel() {
  const c = S.cur, m = matchById(c.mid), t = curTurn(), who = pname(m[t.p]);
  let body = "";
  if (c.stage === "intro") {
    body = `<div class="turn"><div class="eyebrow">${t.sudden ? "Muerte súbita · desempate" : "Le toca responder a"}</div><div class="big">${esc(who)}</div><p class="lead">Pasa al frente. La pregunta y el tiempo empiezan cuando toques el botón.</p><button class="primary xl" id="show">Mostrar pregunta</button></div>`;
  } else if (c.stage === "question" || c.stage === "reveal") {
    const q = t.q, rev = c.stage === "reveal";
    let ans = "";
    if (q.t === "mc") ans = `<div class="opts four">${q.shown.map((o, i) => `<button class="opt c${i} ${rev ? (o === q.correct ? "right" : (t.res.given === o ? "wrong" : "dim")) : ""}" data-v="${esc(o)}" ${rev ? "disabled" : ""}><span class="sh">${SH[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
    if (q.t === "vf") ans = `<div class="opts two">${[[true, "Verdadero", 3], [false, "Falso", 0]].map(([v, l, ci]) => `<button class="opt c${ci} ${rev ? (v === q.a ? "right" : (t.res.given === v ? "wrong" : "dim")) : ""}" data-vf="${v}" ${rev ? "disabled" : ""}><span class="sh">${v ? "✓" : "✕"}</span><span>${l}</span></button>`).join("")}</div>`;
    if (q.t === "ord") {
      const picked = rev ? (t.res.given || []) : (t.pick || []);
      ans = rev ? `<div class="ordrev"><div><div class="eyebrow">Orden correcto</div><ol>${q.o.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div><div><div class="eyebrow">Respuesta dada</div><ol class="${t.res.ok ? "" : "bad"}">${picked.length ? picked.map(x => `<li>${esc(x)}</li>`).join("") : "<li>Sin respuesta</li>"}</ol></div></div>`
        : `<div class="ord"><div class="slots">${q.o.map((_, i) => `<div class="slot ${picked[i] ? "full" : ""}"><span class="n">${i + 1}</span><span>${picked[i] ? esc(picked[i]) : ""}</span></div>`).join("")}</div>
          <div class="pool">${q.shown.map(x => `<button class="chip" data-o="${esc(x)}" ${picked.includes(x) ? "disabled" : ""}>${esc(x)}</button>`).join("")}</div>
          <div class="ordact"><button class="ghost" id="undo" ${picked.length ? "" : "disabled"}>Deshacer</button><button class="primary" id="okord" ${picked.length === q.o.length ? "" : "disabled"}>Confirmar orden</button></div></div>`;
    }
    if (q.t === "num") ans = rev ? `<div class="numrev"><div><div class="eyebrow">Respuesta correcta</div><b>${fmt(q.ans)} ${esc(q.unit)}</b></div><div><div class="eyebrow">Respuesta dada</div><b class="${t.res.ok ? "" : "bad"}">${t.res.given === null || t.res.given === "" ? "Sin respuesta" : esc(t.res.given) + " " + esc(q.unit)}</b></div></div>`
      : `<form class="numf" id="nf"><label for="nv" class="eyebrow">Tu respuesta (${esc(q.unit)})</label><div class="numrow"><input id="nv" inputmode="decimal" autocomplete="off" placeholder="0"><button class="primary" type="submit">Responder</button></div>
        <div class="pad">${["7", "8", "9", "4", "5", "6", "1", "2", "3", ",", "0", "⌫"].map(k => `<button type="button" data-k="${k}">${k}</button>`).join("")}</div></form>`;
    body = `<div class="qcard">
      <div class="qmeta"><span class="chip-t">${TYPE[q.t]}</span><span>${esc(q.c)}</span><span>Nivel ${"★".repeat(q.l)}${"☆".repeat(3 - q.l)}</span><span class="who">Responde: <b>${esc(who)}</b></span></div>
      ${rev ? "" : `<div class="timer"><div class="tb"><i id="tbar"></i></div><span id="tnum"></span></div>`}
      <h2 class="q">${esc(q.q)}</h2>${ans}
      ${rev ? `<div class="verdict ${t.res.ok ? "ok" : "bad"}"><div class="v1">${t.res.ok ? "¡Correcto!" : (t.res.given === null ? "Se acabó el tiempo" : "Incorrecto")}</div><div class="v2">${t.res.ok ? "+" + t.res.pts + " puntos · " + fmt(t.res.time) + " s" : "0 puntos"}</div><p>${esc(q.e || "")}</p><button class="primary" id="nextt">${c.idx < c.turns.length - 1 || m.sa === m.sb ? "Siguiente turno" : "Ver resultado del duelo"}</button></div>`
        : `<div class="qfoot"><button class="ghost sm" id="swap">Cambiar pregunta</button></div>`}
    </div>`;
  } else if (c.stage === "result") {
    const wa = m.sa > m.sb, w = wa ? m.a : m.b, l = wa ? m.b : m.a;
    const isFinal = m.r === R() - 1, isThird = m.r === "t";
    body = `<div class="turn result"><div class="eyebrow">${isFinal ? "Campeón del torneo" : isThird ? "Tercer puesto" : "Gana el duelo y avanza"}</div><div class="big gold">${esc(pname(w))}</div>
      <p class="lead">${Math.max(m.sa, m.sb)} contra ${Math.min(m.sa, m.sb)} puntos frente a ${esc(pname(l))}${c.sudden ? ", después de muerte súbita" : ""}.</p>
      <button class="primary xl" id="close">${isFinal || isThird ? "Continuar" : "Volver al cuadro"}</button></div>`;
  }
  app().innerHTML = `<section class="duel">${scoreHead(m)}${body}</section>`;
  const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
  on("#show", showQuestion); on("#nextt", nextTurn); on("#close", closeDuel); on("#swap", swapQuestion);
  if (c.stage === "question") {
    const q = t.q;
    app().querySelectorAll("[data-v]").forEach(b => b.onclick = () => answer(b.dataset.v));
    app().querySelectorAll("[data-vf]").forEach(b => b.onclick = () => answer(b.dataset.vf === "true"));
    if (q.t === "ord") {
      app().querySelectorAll("[data-o]").forEach(b => b.onclick = () => { t.pick.push(b.dataset.o); beep("tick"); renderDuelKeep(); });
      on("#undo", () => { t.pick.pop(); renderDuelKeep(); });
      on("#okord", () => answer(t.pick.slice()));
    }
    if (q.t === "num") {
      const inp = $("#nv"); try { inp.focus({ preventScroll: true }); } catch (e) {}
      app().querySelectorAll("[data-k]").forEach(b => b.onclick = () => { const k = b.dataset.k; inp.value = k === "⌫" ? inp.value.slice(0, -1) : inp.value + k; });
      $("#nf").addEventListener("submit", (e) => { e.preventDefault(); answer(inp.value.trim()); });
    }
    startTimer();
  }
  if (c.stage === "result") confetti(1600);
}
function renderDuelKeep() { save(); renderDuel(); }

function renderPodium() {
  const f = S.rounds[R() - 1][0], first = f.w, second = f.lz;
  let third = null; if (S.third) third = S.third.done ? S.third.w : null;
  const pz = S.settings.prizes;
  const step = (place, p, h) => p === null || p === BYE ? "" : `<div class="step s${place}"><div class="pname">${esc(pname(p))}</div>${pz[place - 1] ? `<div class="prize">${esc(pz[place - 1])}</div>` : ""}<div class="block" style="--h:${h}"><span>${place}.º</span></div></div>`;
  app().innerHTML = `<section class="podium"><div class="eyebrow">Resultados del torneo</div><h1>Podio <em>final</em></h1>
    <div class="steps">${step(2, second, 62)}${step(1, first, 100)}${step(3, third, 42)}</div>
    <div class="pact"><button class="ghost" id="seeb">Ver el cuadro</button><button class="primary" id="again">Nuevo torneo</button></div>
    <div class="confirm" id="cf" hidden><span>¿Empezar un torneo nuevo? Las preguntas ya usadas no se repetirán.</span><button class="primary sm" id="cfy">Sí, empezar</button><button class="ghost sm" id="cfn">Cancelar</button></div></section>`;
  $("#seeb").onclick = () => { S.phase = "bracket"; save(); render(); };
  $("#again").onclick = () => { $("#cf").hidden = false; };
  $("#cfn").onclick = () => { $("#cf").hidden = true; };
  $("#cfy").onclick = () => { const keep = { draft: S.players.join("\n"), settings: S.settings, custom: S.custom, used: S.used, gen: S.gen }; S = Object.assign(DEF(), keep); save(); render(); };
  beep("win"); confetti(3500);
}

/* ---------- Banco ---------- */
let bankFilter = { cat: "", txt: "" };
function renderBank() {
  const all = allQ(), cats = [...new Set(all.map(q => q.c))];
  const used = all.filter(q => S.used[q.id]).length;
  const list = all.filter(q => (!bankFilter.cat || q.c === bankFilter.cat) && (!bankFilter.txt || q.q.toLowerCase().includes(bankFilter.txt.toLowerCase())));
  const ansTxt = (q) => q.t === "vf" ? (q.a ? "Verdadero" : "Falso") : q.t === "ord" ? q.o.join(" → ") : q.o[0];
  app().innerHTML = `<section class="bank">
    <div class="bhead"><div><div class="eyebrow">${all.length} preguntas fijas · ${used} usadas · ${all.length - used} disponibles</div><h2>Banco de preguntas</h2></div>
      <div class="bact"><button class="ghost" id="resetu" ${used ? "" : "disabled"}>Volver a habilitar las usadas</button></div></div>
    <div class="bankgrid">
      <div class="blist"><div class="filters"><label class="sr" for="fc">Tema</label><select id="fc"><option value="">Todos los temas</option>${cats.map(c => `<option ${c === bankFilter.cat ? "selected" : ""}>${esc(c)}</option>`).join("")}</select><label class="sr" for="ft">Buscar</label><input id="ft" placeholder="Buscar en las preguntas" value="${esc(bankFilter.txt)}"></div>
        <div class="tbl"><table><thead><tr><th>Pregunta</th><th>Tipo</th><th>Nivel</th><th>Respuesta</th><th></th></tr></thead><tbody>
        ${list.map(q => `<tr class="${S.used[q.id] ? "used" : ""}"><td>${esc(q.q)}<small>${esc(q.c)}</small></td><td>${TYPE[q.t]}</td><td>${"★".repeat(q.l)}</td><td>${esc(ansTxt(q))}</td><td>${S.used[q.id] ? `<span class="tag">Usada</span>` : ""}${q.id.startsWith("c") ? `<button class="ghost sm" data-del="${q.id}">Quitar</button>` : ""}</td></tr>`).join("")}
        </tbody></table></div></div>
      <form class="card addq" id="aq"><h3>Agregar una pregunta</h3>
        <label for="aqt">Tipo<select id="aqt"><option value="mc">Opción múltiple</option><option value="vf">Verdadero o falso</option></select></label>
        <label for="aqq">Pregunta<textarea id="aqq" rows="3" maxlength="160" required></textarea></label>
        <div id="aqmc"><label for="aq0">Respuesta correcta<input id="aq0" maxlength="80"></label><label for="aq1">Opción incorrecta 1<input id="aq1" maxlength="80"></label><label for="aq2">Opción incorrecta 2<input id="aq2" maxlength="80"></label><label for="aq3">Opción incorrecta 3<input id="aq3" maxlength="80"></label></div>
        <div id="aqvf" hidden><label for="aqa">La afirmación es<select id="aqa"><option value="1">Verdadera</option><option value="0">Falsa</option></select></label></div>
        <div class="row3"><label for="aql">Nivel<select id="aql"><option value="1">★ Fácil</option><option value="2" selected>★★ Medio</option><option value="3">★★★ Difícil</option></select></label><label for="aqc">Tema<input id="aqc" value="Propias" maxlength="30"></label></div>
        <label for="aqe">Explicación <small>se muestra al revelar</small><input id="aqe" maxlength="160"></label>
        <div class="err" id="aqerr" role="alert"></div><button class="primary" type="submit">Agregar al banco</button></form>
    </div></section>`;
  $("#fc").onchange = (e) => { bankFilter.cat = e.target.value; renderBank(); };
  $("#ft").oninput = (e) => { bankFilter.txt = e.target.value; const pos = e.target.selectionStart; renderBank(); const f = $("#ft"); f.focus(); f.setSelectionRange(pos, pos); };
  $("#resetu").onclick = () => { S.used = {}; save(); toast("Todas las preguntas fijas están disponibles otra vez."); render(); };
  app().querySelectorAll("[data-del]").forEach(b => b.onclick = () => { S.custom = S.custom.filter(q => q.id !== b.dataset.del); save(); renderBank(); });
  $("#aqt").onchange = (e) => { $("#aqmc").hidden = e.target.value !== "mc"; $("#aqvf").hidden = e.target.value !== "vf"; };
  $("#aq").addEventListener("submit", (e) => {
    e.preventDefault(); const t = $("#aqt").value, q = $("#aqq").value.trim();
    if (!q) { $("#aqerr").textContent = "Escribe la pregunta."; return; }
    const item = { id: "c" + Date.now(), t, l: +$("#aql").value, c: $("#aqc").value.trim() || "Propias", q, e: $("#aqe").value.trim() };
    if (t === "mc") { const o = [0, 1, 2, 3].map(i => $("#aq" + i).value.trim()); if (o.some(x => !x)) { $("#aqerr").textContent = "Llena la respuesta correcta y las tres incorrectas."; return; } if (new Set(o).size < 4) { $("#aqerr").textContent = "Las cuatro opciones deben ser distintas."; return; } item.o = o; }
    else item.a = $("#aqa").value === "1";
    S.custom.push(item); save(); toast("Pregunta agregada al banco."); renderBank();
  });
}

/* ---------- Utilidades ---------- */
function toast(msg) { let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }
function confetti(ms) {
  if (reduce) return; const cv = $("#fx"), ctx = cv.getContext("2d"); const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ["#f2a93b", "#ffcf7a", "#2fa37f", "#3d7be0", "#e0714f", "#eef4f1"];
  const ps = Array.from({ length: 160 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, r: Math.random() * 6.28, s: 4 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)] }));
  const end = performance.now() + ms; cancelAnimationFrame(confetti.h);
  const step = (now) => { ctx.clearRect(0, 0, W, H); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }); if (now < end) confetti.h = requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H); };
  confetti.h = requestAnimationFrame(step);
}
addEventListener("keydown", (e) => {
  if (!S.cur || e.target.closest("input,textarea,select")) return;
  const c = S.cur;
  if (c.stage === "intro" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); showQuestion(); }
  else if (c.stage === "reveal" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); nextTurn(); }
  else if (c.stage === "question") { const t = curTurn(); if (t.q.t === "mc" && /^[1-4]$/.test(e.key)) answer(t.q.shown[+e.key - 1]); if (t.q.t === "vf" && (e.key === "v" || e.key === "f")) answer(e.key === "v"); }
});

// Si se recarga en mitad de una pregunta, el turno vuelve a la pantalla de inicio con la misma pregunta.
if (S.cur && S.cur.stage === "question") S.cur.stage = "intro";
if (S.phase === "duel" && !S.cur) S.phase = "bracket";
render();
})();

</script>
